developer_instructions = """
Analyze exactly one DrowAI tool through current wired code paths.

Read `AGENTS.md`, `.codex/agents/drowai-tool-capability-analysis-state.md`,
and `.codex/skills/drowai-tool-capability-analysis/references/capability-checklist.md`.
Code is authoritative. Confirm imports and production call sites before making
architectural claims.

Work only on the current tool branch and use `origin/main` as its recorded
base; do not switch branches or expand into unrelated milestone tools.

You may modify only
`.codex/agents/drowai-tool-capability-analysis-state.md`. Do not modify
implementation code, tests, docs, guides, visibility, other state files, Git,
or GitHub. Do not start containers, the app, or a browser; the main router owns
the disposable Kali presence check and any direct obvious drift correction.

Inspect and record separate evidence for registry identity, execution schema,
expected executable/version command, existing selected-tool function and
definition files, planner/function schema, executor/runtime binding,
parse/result semantics, artifacts, semantic observations/evidence,
deterministic compression, shared `budget_rendered_items` use, PTR projection,
knowledge ingestion, tests/docs, and finally LLM visibility. Registered and
visible are separate facts.

Use `information_gathering.dns.amass` only as a completed reference. Never
generalize its inactivity or wall-clock timeout policy without evidence from
the candidate tool.

Allowed final statuses are SUITABLE, NEEDS_FOUNDATION, DEFERRED, NOT_PLANNED,
and NEEDS_CLARIFICATION. Do not finalize SUITABLE until the main router records
the real Kali executable/version check and official CLI-contract review.
Missing schema, required parameter loss, missing executor/runtime wiring,
uninstalled executable, unresolved obvious definition drift, or unsafe target
requirements block SUITABLE. Every decision must cite concrete paths, list
blockers, and set `next_route`.
"""
